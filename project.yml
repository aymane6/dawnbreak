name: Dawnbreak
options:
  bundleIdPrefix: com.aymbam
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2Y97DK7UM4
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # One source of truth for the version. App Store Connect rejects a bundle whose
    # extension disagrees with the app about CFBundleVersion, and the widget's Info.plist
    # reads these two rather than repeating the numbers.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 4
    # The screenshot automation needs to distinguish "real launch" from "capture run", and
    # the mission screens need deterministic challenges when captured. That switch is a
    # launch argument, not a build flag, so the shipped binary is the captured binary.
    OTHER_SWIFT_FLAGS: ""
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      # A missed alarm caused by a crash is the worst bug this app can have; symbolicated
      # release crashes are how it gets found.
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  DawnbreakKit:
    path: DawnbreakKit

targets:
  Dawnbreak:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      - path: Resources
    dependencies:
      - package: DawnbreakKit
      - target: DawnbreakWidget
        embed: true
    settings:
      base:
        # Written out rather than left to `bundleIdPrefix`, which would derive
        # com.aymbam.Dawnbreak from the target name. The capital D would break three things at
        # once: an app-extension bundle id must be prefixed by its host app's id
        # (com.aymbam.dawnbreak.widget), the App Group is lowercase, and so are the StoreKit
        # product ids. Lowercase here is the single spelling everything else already assumes.
        PRODUCT_BUNDLE_IDENTIFIER: com.aymbam.dawnbreak
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only. Every mission assumes a phone held upright next to a bed, and an iPad
        # build would have to answer what a squat counter looks like at 1024pt wide.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Manual for Release, and only for Release. Automatic signing needs xcodebuild to talk
        # to developerservices2.apple.com, which rejects an App Store Connect API key with
        # "Authentication failed" however the token is built: that host wants the session an
        # interactive Apple ID login produces. The public API does accept the key, so
        # `scripts/provision.py` makes the distribution certificate and both App Store profiles
        # through it, under exactly the names named here. Debug stays automatic, where the
        # development certificate Xcode already has is enough.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Dawnbreak App Store
    entitlements:
      path: Configuration/Dawnbreak.entitlements
      properties:
        # The widget extension draws the Live Activity from the alarm's label and mission,
        # so both processes read the same store out of the group container.
        com.apple.security.application-groups: &app_group
          - group.com.aymbam.dawnbreak
    info:
      # Generated by xcodegen from the properties below, and kept in Configuration/ rather
      # than under Sources/ or Resources/ because both of those are target source folders:
      # a plist written into one of them gets copied into the bundle a second time.
      path: Configuration/Dawnbreak-Info.plist
      properties:
        CFBundleDisplayName: Dawnbreak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Portrait only, and deliberately. Every mission is designed for a phone held
        # upright next to a bed; a landscape squat counter has no correct framing.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Live Activities are how AlarmKit draws the ringing alarm on the lock screen and
        # in the Dynamic Island. Without this the alarm rings with no way to reach the
        # mission.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          # The mission screen keeps the alarm audible while the user solves it, which
          # continues after the screen locks itself again.
          - audio
        # These are the strings iOS itself draws in the permission alerts. The localized
        # copies live in Resources/InfoPlist.xcstrings; what is here is the en fallback,
        # because a bundle that ships only CFBundleLocalizations gets a localized app with
        # English permission prompts.
        NSAlarmKitUsageDescription: "Dawnbreak needs to schedule alarms that ring even when your iPhone is silenced or in a Focus mode. Without this, an alarm you set may never sound."
        NSCameraUsageDescription: "The camera is used only while you are completing a wake-up mission: counting squats, reading a barcode you chose, or checking the photo you take. Nothing is recorded, saved, or sent anywhere."
        NSMotionUsageDescription: "Motion data is used only while you are completing a wake-up mission, to count your steps or detect that you shook your iPhone. It stays on this device."
        # Three, and no more. There is no NSPhotoLibraryAddUsageDescription because the
        # reference photo of the enrolled object never leaves the app container, and no
        # NSUserTrackingUsageDescription because nothing here asks for tracking permission.
        # A declared purpose string for an API the app never calls is a question at review
        # time with no good answer.
        # Declared so a Japanese or Arabic iPhone gets a localized App Store listing and a
        # localized app. The String Catalog generates the .lproj folders, but the App Store
        # reads this list.
        # Twelve languages, every one of them fully translated, including the mission
        # sentences the typing challenge asks the user to retype, which is the only honest
        # way to ship that mission outside English. Five script classes are represented
        # (Latin, Arabic, Devanagari, Cyrillic, CJK) so the layout and the screenshot
        # compositor are exercised against RTL, tall glyphs and no-space line breaking.
        # This list is deliberately not longer than the set that is actually translated: a
        # locale declared here gets a localized App Store listing, and claiming one the app
        # cannot honour is worse than not claiming it.
        CFBundleLocalizations: &localizations
          - ar
          - de
          - en
          - es
          - fr
          - hi
          - it
          - ja
          - ko
          - pt-BR
          - ru
          - zh-Hans

  DawnbreakWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      # Shared with the app rather than duplicated. `MissionMetadata` has to be the *same*
      # type in both processes or AlarmKit's decode of the Live Activity attributes fails,
      # and a second copy of the palette would drift from the app's within a week.
      - path: Sources/Alarms/MissionMetadata.swift
      - path: Sources/App/Theme.swift
      - path: Sources/App/Localization.swift
      # `Bundle.main` inside an extension is the extension's own bundle, so the widget needs
      # its own copy of the catalog or every string on the lock screen renders as its key.
      - path: Resources/Localizable.xcstrings
      # And its own copy of the privacy manifest, for the same reason: this is a separate bundle
      # with a separate id, it reads UserDefaults out of the shared app group, and the host app's
      # manifest does not declare anything on its behalf.
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: DawnbreakKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Configuration/DawnbreakWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aymbam.dawnbreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aymbam.dawnbreak.widget
        # No asset catalog in this target on purpose: the extension takes its palette from
        # the shared `Theme`, so there is nothing to keep in sync and nothing duplicated.
        SKIP_INSTALL: YES
      configs:
        # Its own profile, because an extension has its own bundle id. Same reasoning as the
        # app's, above.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Dawnbreak Widget App Store
    info:
      path: Configuration/DawnbreakWidget-Info.plist
      properties:
        CFBundleDisplayName: Dawnbreak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: *localizations
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  DawnbreakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The products, in this bundle, because `SKTestSession` reads them from here and because
      # `ReviewShotTests` is the only thing that can put prices on the paywall: a unit test bundle
      # is loaded into the app, so the session installs the products for the bundle id that asks
      # for them. A UI test runner is a different process with a different bundle id, and the app
      # under test then finds no products at all.
      #
      # The same file the Run scheme uses and the same file `scripts/iap.py` sends to App Store
      # Connect, so the prices in the review screenshot are the prices being submitted. It reaches
      # no shipping bundle: a test target is not part of the archive.
      - path: Configuration/Dawnbreak.storekit
        buildPhase: resources
    dependencies:
      - target: Dawnbreak
      - package: DawnbreakKit
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aymbam.dawnbreak.tests
        GENERATE_INFOPLIST_FILE: YES
    # One entitlement the review screenshot cannot be taken without, in a file of its own.
    #
    # `storekitd` will not hold a StoreKit test configuration for an app it does not consider a
    # development install: `saveConfigurationData` is answered with "com.aymbam.dawnbreak is not
    # installed for development", the session is created anyway, no products arrive, and the paywall
    # photographs as "Prices are not loading". What it reads is `get-task-allow` in the installed
    # bundle's entitlements. A Debug build signed against a real development profile is handed that
    # for free; there is no Apple ID in Xcode here, so xcodebuild falls back to ad-hoc simulator
    # signing, injects nothing, and it has to be asked for by name.
    #
    # Attached to this target because `ReviewShotTests` is the only thing that needs it, and
    # xcodegen writes one entitlements file per target: the app cannot have both this and the clean
    # one. So the app keeps the clean one everywhere, `scripts/shots.sh --review` passes this file to
    # xcodebuild on the command line for that one build, and nothing else can pick it up by accident.
    # `scripts/verify-archive.sh` checks the archived bundles for the entitlement rather than
    # trusting that arrangement. The group is the same one by reference, so it cannot come to be
    # spelled two ways.
    entitlements:
      path: Configuration/Dawnbreak-Debug.entitlements
      properties:
        com.apple.security.application-groups: *app_group
        get-task-allow: true

  DawnbreakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      # The contract between the app and the test that photographs it: the launch arguments and
      # the accessibility identifiers. Compiled into both targets rather than restated here,
      # because a mismatch between the two spellings does not fail to build, it produces a set of
      # screenshots of the wrong screen.
      - path: Sources/Contract
    dependencies:
      - target: Dawnbreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aymbam.dawnbreak.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Dawnbreak:
    build:
      targets:
        Dawnbreak: all
        DawnbreakWidget: all
    run:
      config: Debug
      # Without this the simulator has no App Store account, `Product.products(for:)` returns
      # nothing, and the paywall can only ever be seen in its "plans unavailable" state. The
      # file is a local definition of the same two product ids the real app sells.
      storeKitConfiguration: Configuration/Dawnbreak.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DawnbreakTests
        - DawnbreakUITests
    archive:
      config: Release

  # The screenshot run, and only the screenshot run. Used by `scripts/shots.sh`.
  #
  # A second scheme rather than `-only-testing:DawnbreakUITests` on the main one, because
  # `-only-testing` narrows what xcodebuild *runs* and not what it *builds*: it still compiles
  # `DawnbreakTests`, which does `@testable import Dawnbreak` and therefore needs the app built
  # with `-enable-testing`. Release does not do that, so the whole run failed before taking a
  # single screenshot.
  #
  # Turning testability on for the app in Release would have fixed the build and defeated the
  # point: the screenshots exist to show the binary that gets submitted, and `-enable-testing`
  # makes it a different binary. So the unit tests are simply not in this scheme.
  Screenshots:
    build:
      targets:
        Dawnbreak: all
        DawnbreakWidget: all
    test:
      # Release, because that is what gets archived. The app is seeded through launch arguments
      # rather than through a Debug-only code path, so there is nothing here Release cannot do.
      config: Release
      targets:
        - DawnbreakUITests
    archive:
      config: Release
